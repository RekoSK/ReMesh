; DIY ESP32-C6 + SX1276 LoRa module, with an optional SH1106 128x64 I2C OLED.
;
; NOTE: esp32c6_base uses the pioarduino arduino-esp32 3.x fork, which upstream
; still marks as experimental.
;
; Two board flavours share this directory, because target.h and
; ESP32C6SX1276Board.cpp already put every display reference behind
; #ifdef DISPLAY_CLASS -- the sources are the same either way, only the flags
; differ. Pick a flavour by env name:
;
;   ESP32C6_SX1276_*          headless: no OLED soldered on
;   ESP32C6_SX1276_SH1106_*   with the SH1106 OLED on PIN_BOARD_SDA/SCL
;
; PIN_USER_BTN is defined for both, but only the display builds read it (the
; headless examples have no UI to drive).

; ---- headless: radio + button, no display ----
[ESP32C6_SX1276]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/esp32c6_sx1276_sh1106
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=7
  -D P_LORA_RESET=1
  -D P_LORA_DIO_0=2
  -D P_LORA_DIO_1=3
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=19
  -D PIN_USER_BTN=20
  -D USER_BTN_PRESSED=HIGH
  -D USE_SX1276
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/esp32c6_sx1276_sh1106>
lib_deps =
  ${esp32c6_base.lib_deps}

; ---- same board, with the SH1106 OLED ----
[ESP32C6_SX1276_SH1106]
extends = ESP32C6_SX1276
build_flags =
  ${ESP32C6_SX1276.build_flags}
  -D DISPLAY_CLASS=SH1106Display
build_src_filter = ${ESP32C6_SX1276.build_src_filter}
  +<helpers/ui/SH1106Display.cpp>
lib_deps =
  ${ESP32C6_SX1276.lib_deps}
  adafruit/Adafruit SH110X @ ~2.1.13

[env:ESP32C6_SX1276_SH1106_companion_radio_ble]
extends = ESP32C6_SX1276_SH1106
build_flags =
  ${ESP32C6_SX1276_SH1106.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32C6_SX1276_SH1106.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic build. Same as the BLE env plus: debug logging, a forced self advert
; every 8s (the companion never adverts on its own), and an optional slower SPI
; clock. The name deliberately does not end in _companion_radio_ble so build.sh
; batch builds skip it.
[env:ESP32C6_SX1276_SH1106_ble_debug]
extends = ESP32C6_SX1276_SH1106
build_flags =
  ${ESP32C6_SX1276_SH1106.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D DEBUG_ADVERT_SECS=8
;  -D LORA_SPI_HZ=1000000    ; uncomment to halve the SPI clock
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32C6_SX1276_SH1106.lib_deps}
  densaugeo/base64 @ ~1.4.0

; same as the BLE env, minus BLE_PIN_CODE, so companion_radio falls back to
; ArduinoSerialInterface over the native USB CDC port.
[env:ESP32C6_SX1276_SH1106_companion_radio_usb]
extends = ESP32C6_SX1276_SH1106
build_flags =
  ${ESP32C6_SX1276_SH1106.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32C6_SX1276_SH1106.lib_deps}
  densaugeo/base64 @ ~1.4.0

; DISABLE_WIFI_OTA=1 in the base section keeps ESP32Board.cpp from pulling in
; the async web server, so esp32_ota.lib_deps is deliberately not listed here.
[env:ESP32C6_SX1276_SH1106_repeater]
extends = ESP32C6_SX1276_SH1106
build_flags =
  ${ESP32C6_SX1276_SH1106.build_flags}
  -D ADVERT_NAME='"ESP32C6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${ESP32C6_SX1276_SH1106.lib_deps}

; Same repeater, no OLED. simple_repeater's UITask is excluded rather than left
; as dead code, so nothing can poll PIN_USER_BTN.
[env:ESP32C6_SX1276_repeater]
extends = ESP32C6_SX1276
build_flags =
  ${ESP32C6_SX1276.build_flags}
  -D ADVERT_NAME='"ESP32C6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276.build_src_filter}
  +<../examples/simple_repeater>
  -<../examples/simple_repeater/UITask.cpp>
lib_deps =
  ${ESP32C6_SX1276.lib_deps}

[env:ESP32C6_SX1276_SH1106_room_server]
extends = ESP32C6_SX1276_SH1106
build_flags =
  ${ESP32C6_SX1276_SH1106.build_flags}
  -D ADVERT_NAME='"ESP32C6 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${ESP32C6_SX1276_SH1106.lib_deps}

[env:ESP32C6_SX1276_room_server]
extends = ESP32C6_SX1276
build_flags =
  ${ESP32C6_SX1276.build_flags}
  -D ADVERT_NAME='"ESP32C6 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276.build_src_filter}
  +<../examples/simple_room_server>
  -<../examples/simple_room_server/UITask.cpp>
lib_deps =
  ${ESP32C6_SX1276.lib_deps}

; Headless companion. ui-new is left out entirely: without DISPLAY_CLASS the
; companion never constructs a UITask, so the screens would only be dead weight.
[env:ESP32C6_SX1276_companion_radio_ble]
extends = ESP32C6_SX1276
build_flags =
  ${ESP32C6_SX1276.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32C6_SX1276.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32C6_SX1276_companion_radio_usb]
extends = ESP32C6_SX1276
build_flags =
  ${ESP32C6_SX1276.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${ESP32C6_SX1276.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32C6_SX1276.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32C6_SX1276_SH1106_kiss_modem]
extends = ESP32C6_SX1276_SH1106
build_src_filter = ${ESP32C6_SX1276_SH1106.build_src_filter}
  +<../examples/kiss_modem/>
